<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAHA Protocol — 3D Cyber-Robot Lab (Full Showcase)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #070709;
      color: #f4f4f5;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #canvas-container:active {
      cursor: grabbing;
    }
    /* Top Bar */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(7,7,9,0.95) 0%, rgba(7,7,9,0) 100%);
      pointer-events: none;
      z-index: 20;
    }
    .badge {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      background: rgba(18,18,24,0.85);
      border: 1px solid rgba(255,197,61,0.3);
      border-radius: 999px;
      backdrop-filter: blur(14px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffc53d;
      box-shadow: 0 0 10px #ffc53d;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
    .title-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.14em;
      color: #ffc53d;
      font-weight: 700;
      text-transform: uppercase;
    }

    /* Robot Option Selector (Top Center) */
    .bot-selector-bar {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px;
      background: rgba(14,14,20,0.9);
      border: 1px solid rgba(255,197,61,0.35);
      border-radius: 16px;
      backdrop-filter: blur(20px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.8);
      pointer-events: auto;
      z-index: 20;
      max-width: 95vw;
      overflow-x: auto;
    }
    .bot-tab-btn {
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: #a1a1aa;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .bot-tab-btn:hover {
      color: #ffffff;
      background: rgba(255,255,255,0.08);
    }
    .bot-tab-btn.active {
      color: #070709;
      background: #ffc53d;
      font-weight: 700;
      border-color: #ffe082;
      box-shadow: 0 0 18px rgba(255,197,61,0.45);
    }
    .bot-tab-btn .badge-pill {
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0,0,0,0.35);
      color: #ffc53d;
    }
    .bot-tab-btn.active .badge-pill {
      background: #070709;
      color: #ffc53d;
    }

    /* Floating Info Spec Card */
    .spec-card {
      position: absolute;
      top: 86px;
      right: 28px;
      width: 350px;
      padding: 20px;
      background: rgba(14,14,18,0.88);
      border: 1px solid rgba(255,197,61,0.25);
      border-radius: 18px;
      backdrop-filter: blur(24px);
      box-shadow: 0 24px 48px rgba(0,0,0,0.75);
      z-index: 15;
    }
    .spec-card h3 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.12em;
      color: #ffc53d;
      margin-bottom: 4px;
      text-transform: uppercase;
      font-weight: 700;
    }
    .spec-tag {
      display: inline-block;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }
    .spec-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 9px;
      font-size: 11px;
      color: #d4d4d8;
      line-height: 1.5;
    }
    .spec-list li {
      display: flex;
      gap: 8px;
    }
    .bullet {
      color: #ffc53d;
      font-weight: bold;
    }
    .spec-list strong {
      color: #ffffff;
    }

    /* Live Reaction Toast */
    .reaction-toast {
      position: absolute;
      top: 86px;
      left: 28px;
      max-width: 410px;
      padding: 16px 20px;
      background: rgba(14,14,18,0.88);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.65);
      z-index: 15;
    }
    .reaction-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: #ffc53d;
      text-transform: uppercase;
      margin-bottom: 6px;
      font-weight: 700;
    }
    .reaction-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #e4e4e7;
      font-style: italic;
      line-height: 1.5;
    }

    /* Bottom Control Bar */
    .bottom-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      background: rgba(14,14,20,0.88);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      box-shadow: 0 24px 50px rgba(0,0,0,0.75);
      z-index: 20;
    }
    .btn-group {
      display: flex;
      gap: 4px;
      background: rgba(0,0,0,0.4);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .ctrl-btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: #a1a1aa;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .ctrl-btn:hover {
      color: #ffffff;
      background: rgba(255,255,255,0.08);
    }
    .ctrl-btn.active {
      color: #070709;
      background: #ffc53d;
      box-shadow: 0 0 14px rgba(255,197,61,0.4);
    }
    .divider {
      width: 1px;
      height: 24px;
      background: rgba(255,255,255,0.1);
    }
    .hint-bar {
      position: absolute;
      bottom: 24px;
      left: 28px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #71717a;
      letter-spacing: 0.08em;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="badge">
      <span class="status-dot"></span>
      <span class="title-text">THE STRAIGHT MAN v2 · 3D ROBOT LAB</span>
    </div>
  </header>

  <!-- Full Showcase Selector Tabs (Options 1-3 Throne + 4-6 Alternative) -->
  <nav class="bot-selector-bar">
    <button class="bot-tab-btn active" id="tab-bot-1">
      <span class="badge-pill">THRONE</span> 1. Frontier Apex
    </button>
    <button class="bot-tab-btn" id="tab-bot-2">
      <span class="badge-pill">THRONE</span> 2. Ronin Samurai
    </button>
    <button class="bot-tab-btn" id="tab-bot-3">
      <span class="badge-pill">THRONE</span> 3. Monolith Oracle
    </button>
    <div class="divider"></div>
    <button class="bot-tab-btn" id="tab-bot-4">
      <span class="badge-pill">STAND</span> 4. Titan-X
    </button>
    <button class="bot-tab-btn" id="tab-bot-5">
      <span class="badge-pill">FLOAT</span> 5. Aethel-01
    </button>
  </nav>

  <!-- Reaction Toast -->
  <div class="reaction-toast">
    <div class="reaction-label" id="reaction-label">THE STRAIGHT MAN · LOGIC CORE</div>
    <p class="reaction-text" id="reaction-text">“Literal confidence: 99.4%. Subtext parsing engine online. Standing by for comedy input.”</p>
  </div>

  <!-- Specs Card -->
  <aside class="spec-card" id="spec-card">
    <h3 id="spec-title">1. FRONTIER APEX</h3>
    <span class="spec-tag" id="spec-tag">Military-Grade Aerospace Mecha</span>
    <ul class="spec-list" id="spec-list">
      <!-- Injected dynamically -->
    </ul>
  </aside>

  <!-- Bottom Navigation & Controls -->
  <div class="bottom-bar">
    <!-- Camera View Presets -->
    <div class="btn-group">
      <button class="ctrl-btn active" id="btn-cam-hero">Hero View</button>
      <button class="ctrl-btn" id="btn-cam-head">Head & Visor</button>
      <button class="ctrl-btn" id="btn-cam-chest">Reactor / Torso</button>
      <button class="ctrl-btn" id="btn-cam-throne">Throne & Mic</button>
    </div>

    <div class="divider"></div>

    <!-- Finish Material Themes -->
    <div class="btn-group">
      <button class="ctrl-btn active" id="btn-finish-obsidian">Obsidian</button>
      <button class="ctrl-btn" id="btn-finish-bronze">Bronze</button>
      <button class="ctrl-btn" id="btn-finish-sapphire">Sapphire</button>
    </div>

    <div class="divider"></div>

    <!-- Stand / Sit Choreography Toggle -->
    <button class="ctrl-btn" id="btn-stand" style="color: #ffc53d; border: 1px solid rgba(255,197,61,0.35); background: rgba(255,197,61,0.1);">Stand Up / Sit</button>

    <!-- Poke Reaction Button -->
    <button class="ctrl-btn" id="btn-poke" style="color: #ffc53d; border: 1px solid rgba(255,197,61,0.35);">Poke Robot</button>
  </div>

  <div class="hint-bar">
    ORBIT: LEFT-CLICK DRAG • ZOOM: SCROLL WHEEL • PAN: RIGHT-CLICK DRAG
  </div>

  <script>
    /* =========================================================================
       THREE.JS STANDALONE SCENE SETUP
       ========================================================================= */
    const container = document.getElementById("canvas-container");
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x070709, 8, 24);

    const camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2.1, 7.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.set(0, 1.7, 0);
    controls.maxPolarAngle = Math.PI * 0.52;
    controls.minDistance = 1.2;
    controls.maxDistance = 12;

    /* ---------------------------------------------------------
       CINEMATIC LIGHTING RIG
       --------------------------------------------------------- */
    scene.add(new THREE.HemisphereLight(0x4a3b2e, 0x070709, 0.65));

    // Warm Amber Key Spotlight
    const spotKey = new THREE.SpotLight(0xffdfa8, 3.8, 18, 0.42, 0.55, 1.1);
    spotKey.position.set(0, 8.5, 2.2);
    spotKey.target.position.set(0, 1.6, 0);
    spotKey.castShadow = true;
    spotKey.shadow.mapSize.set(1024, 1024);
    spotKey.shadow.bias = -0.0004;
    scene.add(spotKey, spotKey.target);

    // Warm Gold Rim Accent (Left)
    const rimGold = new THREE.DirectionalLight(0xffb84d, 1.6);
    rimGold.position.set(-4.5, 4.2, -2.5);
    scene.add(rimGold);

    // Cool Titanium Fill Accent (Right)
    const rimTitanium = new THREE.DirectionalLight(0x82a6cc, 0.95);
    rimTitanium.position.set(4.5, 3.0, -2.0);
    scene.add(rimTitanium);

    // Front Gentle Soft Fill
    const fillFront = new THREE.DirectionalLight(0xfff5e6, 0.5);
    fillFront.position.set(0, 2.0, 5.0);
    scene.add(fillFront);

    /* ---------------------------------------------------------
       SHARED MATERIALS
       --------------------------------------------------------- */
    const armorMat = new THREE.MeshPhysicalMaterial({
      color: 0x141418,
      metalness: 0.75,
      roughness: 0.24,
      clearcoat: 0.9,
      clearcoatRoughness: 0.1,
      reflectivity: 0.85,
    });

    const chassisMat = new THREE.MeshStandardMaterial({
      color: 0x1d1d24,
      metalness: 0.88,
      roughness: 0.38,
    });

    const goldTitaniumMat = new THREE.MeshStandardMaterial({
      color: 0xdeb841,
      metalness: 0.96,
      roughness: 0.18,
    });

    const chromeMat = new THREE.MeshStandardMaterial({
      color: 0xe5e5eb,
      metalness: 0.98,
      roughness: 0.1,
    });

    const visorGlassMat = new THREE.MeshPhysicalMaterial({
      color: 0x040406,
      metalness: 0.15,
      roughness: 0.03,
      clearcoat: 1.0,
      clearcoatRoughness: 0.02,
      transparent: true,
      opacity: 0.92,
    });

    const amberGlowMat = new THREE.MeshBasicMaterial({ color: 0xffb13b });
    const intenseGoldMat = new THREE.MeshBasicMaterial({ color: 0xffdf7a });

    function addMesh(geo, mat, parent, x = 0, y = 0, z = 0) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      m.castShadow = true;
      m.receiveShadow = true;
      parent.add(m);
      return m;
    }

    const UP = new THREE.Vector3(0, 1, 0);
    function addLimb(a, b, r, mat, parent) {
      const A = new THREE.Vector3(...a);
      const B = new THREE.Vector3(...b);
      const d = B.clone().sub(A);
      const len = d.length();
      const m = addMesh(new THREE.CylinderGeometry(r, r, len, 24), mat, parent);
      m.position.copy(A).add(B).multiplyScalar(0.5);
      m.quaternion.setFromUnitVectors(UP, d.normalize());
      return m;
    }

    /* ---------------------------------------------------------
       STAGE PEDESTAL
       --------------------------------------------------------- */
    const stage = addMesh(new THREE.CylinderGeometry(2.3, 2.4, 0.22, 96), chassisMat, scene, 0, 0.11, 0);
    stage.castShadow = false;

    // Glowing Amber Neon Ring
    const lip = new THREE.Mesh(new THREE.TorusGeometry(2.31, 0.014, 12, 128), amberGlowMat);
    lip.rotation.x = Math.PI / 2;
    lip.position.y = 0.22;
    scene.add(lip);

    /* =========================================================================
       THE UPGRADED CYBERNETIC THRONE (FOR OPTIONS 1, 2, 3)
       ========================================================================= */
    const throne = new THREE.Group();
    throne.position.y = 0.22;
    scene.add(throne);

    // Heavy Hexagonal Base Plate with Knurled Edges
    const hexBase = addMesh(new THREE.CylinderGeometry(0.68, 0.72, 0.08, 6), chassisMat, throne, 0, 0.04, 0);
    hexBase.rotation.y = Math.PI / 6;
    const hexTrim = addMesh(new THREE.TorusGeometry(0.69, 0.014, 6, 6), goldTitaniumMat, throne, 0, 0.08, 0);
    hexTrim.rotation.x = Math.PI / 2;
    hexTrim.rotation.z = Math.PI / 6;

    // Central Heavy Hydraulic Suspension Column
    addMesh(new THREE.CylinderGeometry(0.12, 0.14, 0.85, 24), chassisMat, throne, 0, 0.5, 0);
    addMesh(new THREE.CylinderGeometry(0.08, 0.08, 0.6, 24), chromeMat, throne, 0, 0.7, 0);
    addMesh(new THREE.TorusGeometry(0.15, 0.02, 12, 32), goldTitaniumMat, throne, 0, 0.65, 0).rotation.x = Math.PI / 2;

    // 4 Diagonal Outrigger Struts with Foot Pads
    for (let i = 0; i < 4; i++) {
      const a = (i * Math.PI) / 2 + Math.PI / 4;
      addLimb([0, 0.45, 0], [Math.cos(a) * 0.55, 0.08, Math.sin(a) * 0.55], 0.026, chromeMat, throne);
      addMesh(new THREE.CylinderGeometry(0.06, 0.07, 0.05, 16), chassisMat, throne, Math.cos(a) * 0.55, 0.06, Math.sin(a) * 0.55);
    }

    // Footrest Ring (Knurled Titanium & Gold)
    const footRing = addMesh(new THREE.TorusGeometry(0.48, 0.02, 12, 64), goldTitaniumMat, throne, 0, 0.38, 0);
    footRing.rotation.x = Math.PI / 2;

    // Ergonomic Cyber Seat Pan
    addMesh(new THREE.CylinderGeometry(0.54, 0.5, 0.1, 32), chassisMat, throne, 0, 1.0, 0);
    addMesh(new THREE.CylinderGeometry(0.48, 0.48, 0.04, 32), armorMat, throne, 0, 1.055, 0);
    const seatGlow = addMesh(new THREE.TorusGeometry(0.51, 0.012, 8, 48), amberGlowMat, throne, 0, 0.96, 0);
    seatGlow.rotation.x = Math.PI / 2;

    // Mechanical Articulated Spine Backrest
    const spineColumn = new THREE.Group();
    spineColumn.position.set(0, 1.05, -0.42);
    throne.add(spineColumn);

    for (let i = 0; i < 4; i++) {
      const sY = 0.2 + i * 0.24;
      addMesh(new THREE.BoxGeometry(0.16, 0.12, 0.12), chassisMat, spineColumn, 0, sY, 0);
      const brace = addMesh(new THREE.BoxGeometry(0.68 - i * 0.08, 0.03, 0.08), armorMat, spineColumn, 0, sY, 0.04);
      [-1, 1].forEach((sg) => {
        addMesh(new THREE.SphereGeometry(0.024, 10, 8), goldTitaniumMat, brace, sg * (0.34 - i * 0.04), 0, 0);
      });
    }
    [-0.18, 0.18].forEach((bx) => {
      addLimb([bx, 0.1, -0.06], [bx, 0.9, -0.02], 0.02, chromeMat, spineColumn);
    });

    /* =========================================================================
       THE UPGRADED BROADCAST RIBBON HOLO-MICROPHONE (FOR OPTIONS 1, 2, 3)
       ========================================================================= */
    const mic = new THREE.Group();
    mic.position.set(0.60, 0.22, 0.68);
    scene.add(mic);

    const micBase = addMesh(new THREE.CylinderGeometry(0.28, 0.32, 0.06, 8), chassisMat, mic, 0, 0.03, 0);
    micBase.rotation.y = Math.PI / 8;

    const vuRim = addMesh(new THREE.TorusGeometry(0.08, 0.01, 8, 24), goldTitaniumMat, mic, 0, 0.065, 0.15);
    vuRim.rotation.x = -Math.PI / 3;
    const vuFace = addMesh(new THREE.CircleGeometry(0.075, 24), amberGlowMat, mic, 0, 0.065, 0.15);
    vuFace.rotation.x = -Math.PI / 3;
    vuFace.castShadow = false;

    addLimb([0, 0.06, 0], [0, 1.88, 0], 0.024, chromeMat, mic);
    addMesh(new THREE.CylinderGeometry(0.045, 0.045, 0.09, 20), goldTitaniumMat, mic, 0, 1.88, 0);

    for (let c = 0; c < 7; c++) {
      const cY = 0.4 + c * 0.2;
      const cRing = addMesh(new THREE.TorusGeometry(0.035, 0.007, 6, 20), goldTitaniumMat, mic, 0, cY, 0);
      cRing.rotation.x = 0.3;
      cRing.rotation.y = c * 0.8;
    }

    const boomEnd = [-0.18, 2.36, -0.06];
    addLimb([0, 1.88, 0], boomEnd, 0.018, chromeMat, mic);

    const shockOuter = addMesh(new THREE.TorusGeometry(0.14, 0.014, 10, 32), goldTitaniumMat, mic, boomEnd[0], boomEnd[1], boomEnd[2]);
    shockOuter.rotation.y = Math.PI / 4;
    const shockInner = addMesh(new THREE.TorusGeometry(0.11, 0.01, 8, 24), chromeMat, mic, boomEnd[0], boomEnd[1], boomEnd[2]);
    shockInner.rotation.x = Math.PI / 4;

    const capsule = addMesh(new THREE.CylinderGeometry(0.07, 0.07, 0.18, 24), chassisMat, mic, boomEnd[0], boomEnd[1] + 0.02, boomEnd[2]);
    const tubeGlow = addMesh(new THREE.CylinderGeometry(0.035, 0.035, 0.12, 16), amberGlowMat, mic, boomEnd[0], boomEnd[1] + 0.02, boomEnd[2]);
    tubeGlow.castShadow = false;
    const micGrille = new THREE.Mesh(
      new THREE.CylinderGeometry(0.075, 0.075, 0.185, 16, 4, true),
      new THREE.MeshBasicMaterial({ color: 0xffc53d, wireframe: true, transparent: true, opacity: 0.75 })
    );
    micGrille.position.copy(capsule.position);
    mic.add(micGrille);

    /* =========================================================================
       ROBOT COMMON RIG (PELVIS & LEGS ON THRONE FOR OPTIONS 1, 2, 3)
       ========================================================================= */
    const botCommonLegs = new THREE.Group();
    botCommonLegs.position.y = 0.22;
    scene.add(botCommonLegs);

    const botPelvis = new THREE.Group();
    botPelvis.position.set(0, 1.15, -0.06);
    botCommonLegs.add(botPelvis);

    addMesh(new THREE.CylinderGeometry(0.38, 0.42, 0.22, 32), chassisMat, botPelvis, 0, 0, 0);
    const pelvisPlate = addMesh(new THREE.BoxGeometry(0.34, 0.18, 0.08), armorMat, botPelvis, 0, -0.02, 0.22);
    pelvisPlate.rotation.x = 0.2;
    addMesh(new THREE.TorusGeometry(0.39, 0.015, 8, 32), goldTitaniumMat, botPelvis, 0, 0.08, 0).rotation.x = Math.PI / 2;

    // ARTICULATED BIPEDAL LEGS WITH DOWNWARD NORMAL BONES (-Y)
    // Left Leg
    const leftHip = new THREE.Group();
    leftHip.position.set(-0.30, -0.02, 0.02);

    let time = 0;

    function animate() {
      requestAnimationFrame(animate);
      const dt = 0.016;
      time += dt;

      flare = Math.max(0, flare - dt * 2.0);

      // Stand-up & Walk bipedal kinematics for throne robots (Option 1, 2, 3)
      if (botCommonLegs.visible) {
        const targetStand = isStanding ? 1 : 0;
        standProgress += (targetStand - standProgress) * (1 - Math.exp(-6 * dt));
        const standEase = standProgress * standProgress * (3 - 2 * standProgress);

        // Walk cycle when standing
        const walkCycle = isStanding ? time * 3.5 : 0;
        const walkBob = standProgress > 0.8 ? Math.abs(Math.sin(walkCycle * 2)) * 0.04 : 0;
        const stride = standProgress > 0.8 ? Math.sin(walkCycle) : 0;
        const leftStride = stride;
        const rightStride = -stride;

        botPelvis.position.y = standEase * 0.48 + walkBob;
        botPelvis.position.z = standEase * 0.52 + (standProgress > 0.8 ? 0.35 : 0);
        botPelvis.position.x = standProgress > 0.8 ? Math.sin(walkCycle) * 0.05 : 0;

        leftThigh.rotation.x = THREE.MathUtils.lerp(-1.44, 0, standEase) - leftStride * 0.45;
        leftCalf.rotation.x = THREE.MathUtils.lerp(1.44, 0, standEase) + (leftStride < 0 ? -leftStride * 0.55 : 0.05);
        leftFoot.rotation.x = leftStride > 0 ? -leftStride * 0.2 : leftStride * 0.15;

        rightThigh.rotation.x = THREE.MathUtils.lerp(-1.44, 0, standEase) - rightStride * 0.45;
        rightCalf.rotation.x = THREE.MathUtils.lerp(1.44, 0, standEase) + (rightStride < 0 ? -rightStride * 0.55 : 0.05);
        rightFoot.rotation.x = rightStride > 0 ? -rightStride * 0.2 : rightStride * 0.15;

        if (torso1) {
          torso1.rotation.x = -standEase * 0.12 + Math.abs(stride) * 0.03;
          torso1.rotation.y = standProgress > 0.8 ? Math.sin(walkCycle) * 0.12 : 0;

          if (typeof leftShoulder1 !== "undefined") {
            leftShoulder1.rotation.x = THREE.MathUtils.lerp(-0.10, -0.32, standEase) - leftStride * 0.18;
            leftShoulder1.rotation.y = THREE.MathUtils.lerp(0.12, 0.35, standEase);
            leftShoulder1.rotation.z = THREE.MathUtils.lerp(0.46, -0.52, standEase);
            leftUpperArm1.rotation.x = THREE.MathUtils.lerp(-0.05, 0.42, standEase);
            leftForearm1.rotation.x = THREE.MathUtils.lerp(-0.55, 0.28, standEase);
            leftHand1.rotation.x = THREE.MathUtils.lerp(0.18, 0.12, standEase);

            rightShoulder1.rotation.x = THREE.MathUtils.lerp(-0.45, 0.38, standEase) + rightStride * 0.12;
            rightUpperArm1.rotation.x = THREE.MathUtils.lerp(-0.10, 0.35, standEase);
            rightForearm1.rotation.x = THREE.MathUtils.lerp(-0.85, 0.65, standEase);
            rightHand1.rotation.x = THREE.MathUtils.lerp(0.20, 0.12, standEase);
          }
        }
        if (torso2) torso2.rotation.x = -standEase * 0.12;
        if (torso3) torso3.rotation.x = -standEase * 0.12;
      }

      // Throne Mic Tube Glow pulsing
      if (mic.visible) {
        tubeGlow.material.color.setRGB(1, 0.7 + flare * 0.3, 0.25).multiplyScalar(0.7 + 0.3 * Math.sin(time * 3));
      }

      // BOT 1 (Frontier Apex on Throne)
      if (bot1.visible) {

        reactorLight1.intensity = 1.2 + 0.6 * corePulse + flare * 2.2;

        gyroRing1_1.rotation.x = time * 2.2;
        gyroRing1_1.rotation.y = time * 1.5;
        gyroRing1_2.rotation.z = -time * 1.8;
        gyroRing1_2.rotation.x = time * 1.1;

        halo1.rotation.y = time * 0.6;
        haloNodes1.forEach((node, idx) => {
          const a = time * 1.6 + (idx * Math.PI * 2) / 3;
          node.position.set(Math.cos(a) * 0.36, Math.sin(time * 3 + idx) * 0.015, Math.sin(a) * 0.36);
        });

        eqBars1.forEach((bar, idx) => {
          const freq = Math.sin(time * 7 + idx * 0.7) * 0.5 + Math.cos(time * 11 + idx * 0.9) * 0.5;
          const h = Math.max(0.04, (0.08 + Math.abs(freq) * 0.18) * (1 + flare * 0.7));
          bar.scale.y = h / 0.1;
          bar.position.y = h / 2 - 0.04;

        torso1.scale.y = 1 + Math.sin(time * 1.8) * 0.008;

    function setCameraTarget(camX, camY, camZ, tarX, tarY, tarZ) {
      const startPos = camera.position.clone();
      const endPos = new THREE.Vector3(camX, camY, camZ);
      const startTar = controls.target.clone();
      const endTar = new THREE.Vector3(tarX, tarY, tarZ);

      let p = 0;
      function step() {
        p += 0.05;
        if (p < 1) {
          camera.position.lerpVectors(startPos, endPos, p);
          controls.target.lerpVectors(startTar, endTar, p);
          controls.update();
          requestAnimationFrame(step);
        } else {
          camera.position.copy(endPos);
          controls.target.copy(endTar);
          controls.update();
        }
      }
      step();
    }

      { id: "btn-cam-throne", cam: [0.75, 1.6, 2.5], tar: [0.35, 1.4, 0.2] }
    ];

    camButtons.forEach(b => {
      document.getElementById(b.id).addEventListener("click", () => {
        camButtons.forEach(o => document.getElementById(o.id).classList.remove("active"));
        document.getElementById(b.id).classList.add("active");
        setCameraTarget(...b.cam, ...b.tar);
      });
    });

    // Finish Themes
    const finishThemes = {
      obsidian: { color: 0x141418, metalness: 0.75, roughness: 0.24 },
      bronze: { color: 0xb87a3d, metalness: 0.85, roughness: 0.22 },
      sapphire: { color: 0x1d3557, metalness: 0.9, roughness: 0.18 }
    };

    ["obsidian", "bronze", "sapphire"].forEach(mode => {
      document.getElementById(`btn-finish-${mode}`).addEventListener("click", () => {
        ["obsidian", "bronze", "sapphire"].forEach(m => document.getElementById(`btn-finish-${m}`).classList.remove("active"));
        document.getElementById(`btn-finish-${mode}`).classList.add("active");
        const t = finishThemes[mode];
        armorMat.color.setHex(t.color);
        armorMat.metalness = t.metalness;
        armorMat.roughness = t.roughness;
      });
    });

    // Stand Up / Sit button
    const btnStand = document.getElementById("btn-stand");
    if (btnStand) {
      btnStand.addEventListener("click", () => {
        isStanding = !isStanding;
        btnStand.classList.toggle("active", isStanding);
        btnStand.style.background = isStanding ? "#ffc53d" : "rgba(255,197,61,0.1)";
        btnStand.style.color = isStanding ? "#070709" : "#ffc53d";
        btnStand.innerText = isStanding ? "Sit Back Down" : "Stand Up / Step";
      });
    }

    // Poke button
    document.getElementById("btn-poke").addEventListener("click", () => {
      flare = 1.0;
      rockV -= 2.6;
      const d = ALL_SPECS[activeBotId];
      document.getElementById("reaction-text").innerText = `[RECOIL SPIKE] ${d.reactionText}`;
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
